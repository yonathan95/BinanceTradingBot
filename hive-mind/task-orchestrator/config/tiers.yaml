tiers:
  prod_mgmt:
    model: "gpt-3.5-turbo"
    max_tokens: 2048
    temperature: 0.2
    cost_per_1k_tokens: 0.0015
    description: "Economy tier for well-defined, straightforward tasks"
    typical_roles:
      - "product_manager"
      - "documentation"
      - "tester"
  
  standard:
    model: "gpt-4o"
    max_tokens: 4096
    temperature: 0.7
    cost_per_1k_tokens: 0.01
    description: "Standard tier for most tasks, good balance of capability and cost"
    typical_roles:
      - "planner"
      - "architect"
      - "manager"
      - "devops"
  
  premium:
    model: "claude-3-opus"
    max_tokens: 8000
    temperature: 0.7
    cost_per_1k_tokens: 0.03
    description: "Premium tier for complex or critical components"
    typical_roles:
      - "coder"
      - "security"
      - "mlops"

routing_rules:
  # Assign tasks based on complexity and budget
  - when: "complexity == 'L'"
    use: "prod_mgmt"
    reason: "Low complexity tasks can be handled by economy tier"
  
  - when: "complexity == 'M'"
    use: "standard"
    reason: "Medium complexity tasks need standard capabilities"
  
  - when: "complexity == 'H' and budget > 5.0"
    use: "premium"
    reason: "High complexity tasks with sufficient budget use premium tier"
  
  - when: "complexity == 'H' and budget <= 5.0"
    use: "standard"
    reason: "High complexity tasks with limited budget use standard tier"
  
  # Role-based assignments regardless of complexity
  - when: "role == 'product_manager'"
    use: "prod_mgmt"
    reason: "Product management tasks are well-suited for economy tier"
  
  - when: "role == 'documentation'"
    use: "prod_mgmt"
    reason: "Documentation tasks are well-suited for economy tier"
  
  - when: "role == 'coder' and budget > 3.0"
    use: "premium"
    reason: "Coding tasks with sufficient budget benefit from premium tier"
  
  - when: "role == 'security'"
    use: "premium"
    reason: "Security tasks require precision and depth of premium tier" 
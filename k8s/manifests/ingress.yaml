apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hivemind-ingress
  namespace: hivemind
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: hivemind.local  # Add this to your hosts file pointing to minikube IP
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 5000
      - path: /cost-domain
        pathType: Prefix
        backend:
          service:
            name: cost-domain-service
            port:
              number: 8081
      - path: /prometheus
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port:
              number: 9090
      - path: /grafana
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port:
              number: 3000 
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hivemind
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'control-plane'
        static_configs:
          - targets: ['control-plane-service:8000']

      - job_name: 'cost-domain'
        static_configs:
          - targets: ['cost-domain-service:8081']

      - job_name: 'hivemind-api'
        metrics_path: /metrics
        static_configs:
          - targets: ['api-service:5000'] 